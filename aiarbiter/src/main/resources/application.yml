spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aiarbiter}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  cors-origins: ${CORS_ORIGINS:http://localhost:8080}

ai:
  providers:
    worker-a:
      base-url: https://api.onlysq.ru/ai/openai
      api-key: ${ONLYSQ_API_KEY}
      model: gpt-5.4
    worker-b:
      base-url: https://api.onlysq.ru/ai/openai
      api-key: ${ONLYSQ_API_KEY}
      model: claude-sonnet-4-6
    judge:
      base-url: https://api.onlysq.ru/ai/openai
      api-key: ${ONLYSQ_API_KEY}
      model: gpt-5.4
  allowed-models: claude-haiku-4-5,claude-sonnet-4-5,claude-sonnet-4-6,gpt-5.4,gpt-5.2-chat,deepseek-v4-flash,deepseek-v3,deepseek-r1,gemini-3-flash
