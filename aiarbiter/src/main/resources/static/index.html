<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Arbiter</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.6/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" id="hljs-theme" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/layout.css" />
<link rel="stylesheet" href="css/components.css" />
</head>
<body>
<div class="app">
  <div id="sidebar-root"></div>
  <main class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbar-title">AI Arbiter</div>
      <div class="topbar-sub" id="topbar-sub"></div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-copy" title="Copy link"></button>
      </div>
    </div>
    <div class="scroll-area">
      <div class="container">
        <div id="composer-root"></div>
        <div id="error-banner" style="display:none;margin-top:16px;padding:12px 14px;border-radius:8px;border:1px solid var(--del-text);background:var(--del);color:var(--del-text);font-size:13.5px"></div>
        <div id="empty-state" class="empty-state" style="display:none">
          <h3 id="empty-title"></h3>
          <p id="empty-body"></p>
        </div>
        <div id="results-root" style="display:none">
          <div class="section-head"><h2 id="workers-label"></h2><div class="rule"></div></div>
          <div id="workers-root"></div>
          <div class="section-head"><h2 id="verdict-label"></h2><div class="rule"></div></div>
          <div id="verdict-root"></div>
        </div>
      </div>
    </div>
  </main>
</div>
<script src="js/data.js"></script>
<script src="js/icons.js"></script>
<script src="js/tweaks.js"></script>
<script src="js/components/sidebar.js"></script>
<script src="js/components/composer.js"></script>
<script src="js/components/worker-column.js"></script>
<script src="js/components/verdict.js"></script>
<script src="js/api.js"></script>
<script src="js/state.js"></script>
<script src="js/render.js"></script>
<script src="js/app.js"></script>
</body>
</html>
